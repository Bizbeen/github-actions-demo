name: My First Pipeline
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Welcome Message 
        run: echo "Hello DevOps Students!"

